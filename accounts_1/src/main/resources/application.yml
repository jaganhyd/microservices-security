logging: 
  level: 
    com: 
      example: 
        accounts_1: DEBUG
        
resilience4j.circuitbreaker:                             
  configs: 
    default: 
      slidingWindowSize: 10                             #monitor 10 req before change status colse -> open
      permittedNumberOfCallsInHalfOpenState: 2          #Allow 2 reqs in half Ope
      failureRateThreshold: 50                          #if at least 50% of my requests are failed, circuit breaker pattern can move to the open state from the closed state.
      waitDurationInOpenState: 10000 
      
resilience4j.retry:                             
  configs: 
    default:
      maxRetryAttempts: 3                           #maxRetryAttempts latest,  maximumRetryAttempts old
      #waitDuration: 100
      waitDuration: 500                            #CB+fallback  will trigger instead of retry+fallback, for that update default CB  in gateway level
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
      ignoreExceptions: 
        - java.lang.NullPointerException
      retryExceptions: 
        - java.util.concurrent.TimeoutException
    
#ratelimiter works irrespective of user, it effects all user
resilience4j.ratelimiter: 
  configs: 
    default: 
      timeoutDuration: 1000    # wait for a maximum of one second. Within one second if my RateLimiter is not allowing the request, then simply it is not going to wait further and return back with the error.   
      limitRefreshPeriod: 5000       #every 5 sec only 1 request allowed
      limitForPeriod: 1