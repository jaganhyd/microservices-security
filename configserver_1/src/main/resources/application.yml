server:
  port: 8071

spring:
  application:
    name: "configserver-1"
  profiles:
    #active: native
    active: git
  cloud:
    config:
      server:
        #native:
          #search-locations: "classpath:/config"
          #search-locations: "file:///F://microserviceConfigs"
        git: 
          uri: "https://github.com/jaganhyd/jaganb-ms-configs.git"
          #username: jaganhyd
          #password: #ambbanghyd@123#
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true    
          
#commented for docker generation          
#  rabbitmq: 
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest" 
    
          
#Actuator 
management: 
  endpoints: 
    web: 
      exposure: 
        include: "*"
  health:  
    readiness-state: 
      enabled: true
    liveness-state: 
      enabled: true
  endpoint: 
    health: 
      probes: 
        enabled: true
      
      
      
      
      
       