name: jbmicroservice

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    ports:
      - "127.0.0.1:7080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_DB: "dev-file"
      KC_METRICS_ENABLED: "false"
      JAVA_OPTS_APPEND: "-Xms64m -Xmx512m -XX:MaxMetaspaceSize=192m"
    command: "start-dev"
#    deploy:
#      resources:
#        limits:
#          memory: 896m
#        reservations:
#          memory: 512m
    networks:
      - jaganMs

#  keycloak:
#    image: quay.io/keycloak/keycloak:25.0.2
#    container_name: keycloak
#    ports:
#      - "7080:8080"
#    environment:
#      KEYCLOAK_ADMIN: "admin"
#      KEYCLOAK_ADMIN_PASSWORD: "admin"
#      KC_METRICS_ENABLED: "false" # Saves memory by disabling metrics if unneeded
#      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m -XX:MaxMetaspaceSize=256m"
#    command: "start-dev"
#    deploy:
#      resources:
#        limits:
#          memory: 1300m
#        reservations:
#          memory: 700m
#    networks:
#      - jaganMs

  redis:                   #for Ratelimiter
    #image: redis
    image: redis
    container_name: redis-ms
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      timeout: 10s
      retries: 10
#    deploy:
#      resources:
#        limits:
#          memory: 512m
#        reservations:
#          memory: 128m
    networks:
      - jaganMs

  rabbitmq:
    image: rabbitmq:3.13-management
    #image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-ms
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    #environment:
    #  RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+P 1048576"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      #test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
       - jaganMs

  configserver:
    image: "jagan619/configserver_1:v1"
    container_name: configserver-ms
    ports: 
      - "8071:8071"
    depends_on:
      rabbitmq:
        condition: service_healthy
        #condition: service_started
    healthcheck: 
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      #test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
#    deploy:
#      resources:
#        limits:
#          memory: 700m
#        reservations:
#          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "configserver-1"  #spring app name present yml file
      SPRING_RABBITMQ_HOST: "rabbitmq"
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    networks:
      - jaganMs

  #--------------------------------------------------------------------
  eurekaserver:
    image: "jagan619/eurekaserver:v1"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 700m
        reservations:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_RABBITMQ_HOST: "rabbitmq"
      #CONFIG_SERVER_URL: "http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    networks:
      - jaganMs
#----------------------------------------------------------------------
  accounts:
    image: "jagan619/accounts_1:v1"
    container_name: accounts-ms
    #    ports:      #commented during security test
    #      - "8080:8080"
    depends_on:
      #      accountsdb:
      #        condition: service_healthy
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
   #   rabbitmq:
   #     condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "accounts-1"  #with this name ms will be registered in eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      #CONFIG_SERVER_URL: "http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default
      SPRING_RABBITMQ_HOST: "rabbitmq"
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    #      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
    deploy:
      resources:
        limits:
          memory: 700m
        #reservations:
         # memory: 400m
    networks:
      - jaganMs
#----------------------------------------------------------------------------------------
  loans:
    image: "jagan619/loans_1:v1"
    container_name: loans-ms
    #    ports:    #commented during security test
    #      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    #  rabbitmq:
    #    condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 700m
        reservations:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "loans-1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      #CONFIG_SERVER_URL: "http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default
      SPRING_RABBITMQ_HOST: "rabbitmq"
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    networks:
      - jaganMs
  #-----------creating 2nd instance of loans----------------------------------
  #  loans1:
  #    image: "jagan619/loans_1:v1"
  #    container_name: loans-ms1
  #    ports:
  #      - "8091:8090"
  #    depends_on:
  #      configserver:
  #        condition: service_healthy
  #      eurekaserver:
  #        condition: service_healthy
  #    environment:
  #      SPRING_APPLICATION_NAME: "loans-1"
  #    extends:
  #      file: common-config.yml
  #      service: microservice-eureka-config
#------------------------------------------------------------------------------------
  cards:
    image: "jagan619/cards_1:v1"
    container_name: cards-ms
    #    ports:            #commented during security test
    #      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
     # rabbitmq:
     #   condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 700m
        reservations:
          memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "cards-1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      SPRING_PROFILES_ACTIVE: default
      #CONFIG_SERVER_URL: "http://configserver:8071/"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    networks:
      - jaganMs
#------------------------------------------------------------------------------------
  gatewayserver:
    image: "jagan619/gatewayserver:v1"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    depends_on:
      accounts:
        condition: service_healthy
      cards:
        condition: service_healthy
      loans:
        condition: service_healthy
      redis:
        condition: service_healthy
    #deploy:
    #  resources:
    #    limits:
    #      memory: 700m
    #    reservations:
    #      memory: 400m
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver-1"
      SPRING_DATA_REDIS_CONNECT-TIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"
      SPRING_CONFIG_IMPORT: configserver:http://configserver-ms:8071/
      #CONFIG_SERVER_URL: "http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default
      #SPRING_RABBITMQ_HOST: "rabbitmq"
      #JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    networks:
      - jaganMs

#-------------------------------------------------------------------------------------------
volumes:
  keycloak_data:
    driver: local

networks:
  jaganMs:
    driver: bridge
