#-------------------------------------------
  configserver: 
    image: "jagan619/configserver_1:v1"
    container_name: configserver-ms
    ports: 
      - "8071:8071"
    depends_on: 
      rabbit: 
        condition: service_healthy
    healthcheck: 
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends: 
      file: common-config.yml
      service: microservice-base-config
#--------------------------------------------------------------------
  eurekaserver:
    image: "jagan619/eurekaserver:v1"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends: 
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
#-----------------------------------------------------------------
  accounts: 
    image: "jagan619/accounts_1:v1"
    container_name: accounts-ms
#    ports:      #commented during security test
#      - "8080:8080"
    depends_on: 
#      accountsdb:
#        condition: service_healthy
      configserver: 
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      rabbit: 
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment: 
      SPRING_APPLICATION_NAME: "accounts-1"  #with this name ms will be registered in eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    extends:
      file: common-config.yml
      service: microservice-configserver-config
#------------------------------------------------------------------------------
  loans:
    image: "jagan619/loans_1:v1"
    container_name: loans-ms
#    ports:    #commented during security test
#      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver: 
        condition: service_healthy
    healthcheck: 
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "loans-1"
    extends:
      file: common-config.yml
      service: microservice-eureka-config
