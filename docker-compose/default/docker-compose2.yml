services: 
 
  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
       - jaganMs
#    extends:
#      file: common-config.yml
#      service: network-deploy-service
#-----------------------------------------------------------------------------
  configserver_1:            
    image: "jagan619/configserver_1:v1"
    container_name: configserver_1
    ports: 
      - "8071:8071"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: 
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: 
      resources: 
        limits: 
          memory: 700m
    environment:
      SPRING_RABBITMQ_HOST: "rabbitmq"
    networks:
      - jaganMs 
#----------------------------------------------------------------------
  accounts_1: 
    image: "jagan619/accounts_1:v1"
    container_name: accounts_1
    ports: 
      - "8080:8080"
    depends_on: 
      configserver_1: 
        condition: service_healthy
    deploy: 
      resources: 
        limits: 
          memory: 700m
    networks:
      - jaganMs 
    environment: 
      SPRING_APPLICATION_NAME: "accounts_1"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver_1:8071/"
      SPRING_PROFILES_ACTIVE: default
