#Actuator 
management: 
  endpoints: 
    web: 
      exposure: 
        include: "*"
  health:  
    readiness-state: 
      enabled: true
    liveness-state: 
      enabled: true
      
  endpoint: 
    shutdown: 
      enabled: true		
    health: 
      probes: 
        enabled: true
  info: 
    env: 
      enabled: true        

endpoints:  
  shutdown: 
    enabled: true	

eureka:  
  instance: 
    preferIpAddress: true #register with ip address instead of dns
  client:   
    fetchRegistry: true                  
    registerWithEureka: true
    serviceUrl: 
      defaultZone: http://localhost:8070/eureka/

info: 
  app: 
    name: "cards-1"
    description: "Jagan Microservice cards_1 App"
    version: "1.0.0"

